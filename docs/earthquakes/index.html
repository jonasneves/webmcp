<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#eef0e6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='15'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E">
  <title>WebMCP PoC — Earthquake Monitor</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../app.css">
  <link rel="stylesheet" href="../ui.css">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js" as="script">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <div class="main-column">
    <header>
      <div class="header-left">
        <h1><a class="home-link" href="../">WebMCP PoC</a></h1>
        <button class="tools-toggle" id="tools-toggle" aria-expanded="false" aria-controls="tools-panel">&#9660; 9 tools</button>
      </div>
      <div class="settings-wrap">
        <button class="settings-btn" id="settings-btn" aria-label="Settings" aria-expanded="false" aria-controls="settings-popover" title="Settings">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
            <path d="M6.08 1.5a.5.5 0 0 0-.495.43l-.198 1.382a4.5 4.5 0 0 0-.968.565L3.1 3.29a.5.5 0 0 0-.617.172L1.5 4.9a.5.5 0 0 0 .1.657l1.1.9A4.5 4.5 0 0 0 2.6 7.5c0 .328.034.648.1.943l-1.1.9a.5.5 0 0 0-.1.657l.984 1.438a.5.5 0 0 0 .617.172l1.319-.588c.298.213.617.398.968.565l.198 1.383a.5.5 0 0 0 .495.43h1.84a.5.5 0 0 0 .495-.43l.198-1.383a4.5 4.5 0 0 0 .968-.565l1.319.588a.5.5 0 0 0 .617-.172L13.4 10a.5.5 0 0 0-.1-.657l-1.1-.9c.066-.295.1-.615.1-.943s-.034-.648-.1-.943l1.1-.9A.5.5 0 0 0 13.5 4.9l-.984-1.438a.5.5 0 0 0-.617-.172l-1.319.588a4.5 4.5 0 0 0-.968-.565L9.415 1.93A.5.5 0 0 0 8.92 1.5H6.08ZM7.5 9.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z" fill="currentColor"/>
          </svg>
        </button>
        <div class="settings-popover" id="settings-popover" hidden role="dialog" aria-label="Settings">

          <div class="settings-section">
            <div class="settings-section-label">Appearance</div>
            <div class="theme-toggle" role="group" aria-label="Color theme">
              <button class="theme-opt" data-theme="system">System</button>
              <button class="theme-opt" data-theme="light">Light</button>
              <button class="theme-opt" data-theme="dark">Dark</button>
            </div>
          </div>

        </div>
      </div>
    </header>

    <div class="tools-panel" id="tools-panel" data-collapsed="true">
      <div class="tools-panel-inner" id="tools-panel-inner"></div>
    </div>

    <!-- Filled by the runtime from mount({ dataSource }). Hidden until the
         fetch lands, so it never describes rows that aren't there yet. -->
    <div class="source-bar" id="source-bar" hidden></div>

    <main>
      <nav class="controls" aria-label="Views and filters">
        <button class="chip" aria-pressed="true" data-filter="all">All</button>
        <button class="chip" aria-pressed="false" data-filter="mag5">Magnitude 5+</button>
        <button class="chip" aria-pressed="false" data-filter="mag3">Magnitude 3+</button>
        <button class="chip" aria-pressed="false" data-view="chart">Magnitude Chart</button>
        <button class="chip" aria-pressed="false" data-filter="felt">Felt Earthquakes</button>
        <button class="chip" aria-pressed="false" data-filter="recent">Recent 24h</button>
      </nav>

      <div id="display"></div>
    </main>
  </div>

  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <p class="dialog-title" id="confirm-title">Confirm action</p>
      <p class="dialog-tool" id="confirm-tool"></p>
      <p class="dialog-args" id="confirm-args"></p>
      <div class="dialog-actions">
        <button class="btn-cancel" value="cancel">Cancel</button>
        <button class="btn-confirm" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>

  <dialog id="prompt-dialog" aria-labelledby="prompt-title">
    <form method="dialog">
      <p class="dialog-title" id="prompt-title"></p>
      <input type="text" class="dialog-input" id="prompt-input" autocomplete="off">
      <div class="dialog-actions">
        <button class="btn-cancel" value="cancel">Skip</button>
        <button class="btn-confirm" value="confirm">Add</button>
      </div>
    </form>
  </dialog>

  <script>
    (function () {
      const stored = localStorage.getItem('webmcp-theme') || 'system';
      const resolved = stored === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : stored;
      document.documentElement.dataset.theme = resolved;
    })();
  </script>
  <script type="module">
    import { mount, showToast, showConfirmDialog, showPromptDialog } from '../runtime/index.js';

    /* ── State ── */

    let EARTHQUAKES = [];
    const flaggedQuakes = new Map();
    let currentView = { type: 'table', data: null, label: null, filters: null };
    let chartInstance = null;

    /* ── Utilities ── */

    const fmt = (n, d = 1) => n.toFixed(d);
    const matchPlace = (q, query) => q.place.toLowerCase().includes(query.toLowerCase());

    function extractRegion(place) {
      if (!place || !place.includes(',')) return 'Other';
      return place.split(',').pop().trim();
    }
    function severityTier(mag) {
      if (mag >= 7) return 'major';
      if (mag >= 5) return 'strong';
      if (mag >= 3) return 'moderate';
      return 'minor';
    }
    const severityBadgeClass = (tier) => tier === 'minor' ? 'low' : tier === 'moderate' ? 'medium' : 'high';

    function timeAgo(timestamp) {
      const diff = Date.now() - timestamp;
      const s = Math.floor(diff / 1000);
      if (s < 60) return `${s}s ago`;
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ago`;
      return `${Math.floor(h / 24)}d ago`;
    }

    function filterData({ min_magnitude, search, time_range, felt } = {}) {
      const now = Date.now();
      return EARTHQUAKES.filter(q => {
        if (min_magnitude != null && q.magnitude < min_magnitude) return false;
        if (search && !matchPlace(q, search)) return false;
        if (time_range === '24h' && (now - q.time) > 86_400_000) return false;
        if (time_range === '7d' && (now - q.time) > 604_800_000) return false;
        if (time_range === '30d' && (now - q.time) > 2_592_000_000) return false;
        if (felt && q.felt <= 0) return false;
        return true;
      });
    }

    /* ── Persistence ── */

    function persistFlags() {
      const data = [...flaggedQuakes.entries()].map(([id, flag]) => ({ id, ...flag }));
      localStorage.setItem('webmcp-quake-flags', JSON.stringify(data));
    }
    function loadFlags() {
      try {
        const data = JSON.parse(localStorage.getItem('webmcp-quake-flags') || '[]');
        data.forEach(({ id, ...flag }) => flaggedQuakes.set(id, flag));
      } catch (err) {
        console.warn('Discarding corrupted webmcp-quake-flags:', err);
        localStorage.removeItem('webmcp-quake-flags');
      }
    }

    /* ── ECharts theme ── */

    const display = document.getElementById('display');

    echarts.registerTheme('webmcp', {
      backgroundColor: 'transparent',
      textStyle: { fontFamily: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" },
      title: { textStyle: { color: '#f1f5f9' } },
      legend: { textStyle: { color: '#94a3b8' } },
      categoryAxis: { axisLine: { lineStyle: { color: '#475569' } }, axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#1e293b' } } },
      valueAxis: { axisLine: { lineStyle: { color: '#475569' } }, axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#1e293b' } } },
      tooltip: { backgroundColor: '#1e293b', borderColor: '#475569', textStyle: { color: '#f1f5f9' } }
    });

    window.addEventListener('resize', () => chartInstance?.resize());

    /* ── Renderers ── */

    let runtime;

    function renderSkeleton() {
      display.innerHTML = `<div class="loading-skeleton">${Array.from({length:8},(_,i)=>`<div class="skeleton-row" style="animation-delay: ${i * 80}ms"></div>`).join('')}</div>`;
    }

    function renderTable(quakes, label, filters) {
      currentView = { type: 'table', data: quakes, label, filters };
      const summary = label || `${quakes.length} earthquakes`;

      if (quakes.length === 0) {
        display.innerHTML = `<p class="empty-state">No earthquakes match the current filters.</p>`;
        encodeViewToHash(); runtime?.refresh();
        return;
      }

      display.innerHTML = `
        <div class="summary-row">
          <p class="view-label">Showing ${summary}</p>
          <span class="summary-count">${quakes.length} result${quakes.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Location</th><th class="num">Magnitude</th><th class="num">Depth (km)</th><th>Time</th><th class="num">Felt</th></tr></thead>
          <tbody>
            ${quakes.map(q => {
              const isFlagged = flaggedQuakes.has(q.id);
              const tier = severityTier(q.magnitude);
              const badgeCls = severityBadgeClass(tier);
              return `<tr tabindex="0" data-id="${q.id}">
                <td><span class="name-cell">${isFlagged ? '<span class="flag-dot" title="Flagged"></span>' : ''}${q.place}</span></td>
                <td class="num"><span class="risk-badge ${badgeCls}">${fmt(q.magnitude)}</span></td>
                <td class="num">${fmt(q.depth)}</td>
                <td>${timeAgo(q.time)}</td>
                <td class="num">${q.felt || '\u2014'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        </div>
      `;
      encodeViewToHash(); runtime?.refresh();
    }

    function renderEChart(option, label) {
      currentView = { type: 'chart', data: option, label, filters: {} };
      if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
      display.innerHTML = `<p class="view-label">${label}</p><div id="chart-container" class="chart-container"></div>`;
      chartInstance = echarts.init(document.getElementById('chart-container'), 'webmcp');
      chartInstance.setOption(option);
      encodeViewToHash(); runtime?.refresh();
    }

    function renderDetail(quake) {
      const q = quake;
      const tier = severityTier(q.magnitude);
      const badgeCls = severityBadgeClass(tier);
      const flag = flaggedQuakes.get(q.id);
      currentView = { type: 'detail', data: q, label: null, filters: null };
      const escape = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

      display.innerHTML = `
        <button class="back-btn">&#8592; Back to list</button>
        <div class="detail-card">
          <div class="detail-header">
            <h2>${flag ? '<span class="flag-dot"></span>' : ''}${q.place}</h2>
            <p class="detail-meta">${q.type} &middot; ${q.status} &middot; ${new Date(q.time).toLocaleString()}</p>
          </div>
          ${flag ? `<p class="flag-note">${escape(flag.note)}</p>` : ''}
          <div class="detail-grid">
            <div class="detail-cell"><div class="detail-cell-label">Magnitude</div><div class="detail-cell-value color-risk-${badgeCls}">${fmt(q.magnitude)}</div></div>
            <div class="detail-cell"><div class="detail-cell-label">Depth</div><div class="detail-cell-value">${fmt(q.depth)}<span class="detail-suffix"> km</span></div></div>
            <div class="detail-cell"><div class="detail-cell-label">Significance</div><div class="detail-cell-value">${q.significance}</div></div>
            <div class="detail-cell"><div class="detail-cell-label">Felt Reports</div><div class="detail-cell-value">${q.felt || 0}</div></div>
            <div class="detail-cell"><div class="detail-cell-label">Tsunami Warning</div><div class="detail-cell-value ${q.tsunami ? 'color-risk-high' : 'color-risk-low'}">${q.tsunami ? 'Yes' : 'No'}</div></div>
            <div class="detail-cell"><div class="detail-cell-label">Coordinates</div><div class="detail-cell-value">${fmt(q.lat, 3)}, ${fmt(q.lon, 3)}</div></div>
          </div>
        </div>
      `;
      encodeViewToHash(); runtime?.refresh();
    }

    function renderComparison(q1, q2) {
      currentView = { type: 'comparison', data: [q1, q2], label: null, filters: null };
      const metrics = [
        { label: 'Magnitude', key: 'magnitude', format: v => fmt(v) },
        { label: 'Depth (km)', key: 'depth', format: v => fmt(v) },
        { label: 'Significance', key: 'significance', format: v => v },
        { label: 'Felt Reports', key: 'felt', format: v => v || 0 },
        { label: 'Tsunami Warning', key: 'tsunami', format: v => v ? 'Yes' : 'No' },
      ];
      display.innerHTML = `
        <button class="back-btn">&#8592; Back to list</button>
        <p class="view-label">Comparing two earthquakes</p>
        <table class="compare-table">
          <thead><tr><th>Metric</th><th>${q1.place}</th><th>${q2.place}</th></tr></thead>
          <tbody>
            ${metrics.map(m => `<tr>
              <td class="compare-metric">${m.label}</td>
              <td class="compare-value">${m.format(q1[m.key])}</td>
              <td class="compare-value">${m.format(q2[m.key])}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      `;
      encodeViewToHash(); runtime?.refresh();
    }

    function refreshCurrentView() {
      if (currentView.type === 'table') renderTable(currentView.data || EARTHQUAKES, currentView.label, currentView.filters);
      else if (currentView.type === 'chart' && currentView.data) renderEChart(currentView.data, currentView.label);
      else if (currentView.type === 'detail' && currentView.data) renderDetail(currentView.data);
      else if (currentView.type === 'comparison' && currentView.data) renderComparison(currentView.data[0], currentView.data[1]);
    }

    /* ── Hash routing ── */

    function encodeViewToHash() {
      const params = new URLSearchParams();
      params.set('view', currentView.type);
      const f = currentView.filters || {};
      if (currentView.type === 'table') {
        if (f.min_magnitude) params.set('min_mag', f.min_magnitude);
        if (f.time_range) params.set('time', f.time_range);
        if (f.felt) params.set('felt', '1');
      } else if (currentView.type === 'detail' && currentView.data) {
        params.set('id', currentView.data.id);
      } else if (currentView.type === 'comparison' && currentView.data) {
        params.set('q1', currentView.data[0].id);
        params.set('q2', currentView.data[1].id);
      }
      history.replaceState(null, '', '#' + params.toString());
    }

    function decodeHashToView() {
      const hash = location.hash.slice(1);
      if (!hash) return false;
      const params = new URLSearchParams(hash);
      const view = params.get('view');

      if (view === 'table') {
        const min_magnitude = params.get('min_mag') ? +params.get('min_mag') : null;
        const time_range = params.get('time');
        const felt = params.get('felt') === '1';
        const filters = {};
        if (min_magnitude) filters.min_magnitude = min_magnitude;
        if (time_range) filters.time_range = time_range;
        if (felt) filters.felt = true;
        const filtered = filterData(filters);
        const parts = [];
        if (min_magnitude) parts.push(`magnitude ${min_magnitude}+`);
        if (time_range) parts.push(`last ${time_range}`);
        if (felt) parts.push('felt');
        renderTable(filtered, parts.length ? parts.join(', ') : null, filters);
        return true;
      }
      if (view === 'chart') { renderTable(EARTHQUAKES); return true; }
      if (view === 'detail') {
        const q = EARTHQUAKES.find(x => x.id === params.get('id'));
        if (q) { renderDetail(q); return true; }
      }
      if (view === 'comparison') {
        const q1 = EARTHQUAKES.find(x => x.id === params.get('q1'));
        const q2 = EARTHQUAKES.find(x => x.id === params.get('q2'));
        if (q1 && q2) { renderComparison(q1, q2); return true; }
      }
      return false;
    }

    window.addEventListener('hashchange', () => { if (EARTHQUAKES.length) decodeHashToView(); });

    /* ── Display events ── */

    display.addEventListener('click', (e) => {
      const row = e.target.closest('tr[data-id]');
      if (row) { const q = EARTHQUAKES.find(x => x.id === row.dataset.id); if (q) renderDetail(q); return; }
      if (e.target.closest('.back-btn')) renderTable(EARTHQUAKES);
    });
    display.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const row = e.target.closest('tr[data-id]');
      if (row) { const q = EARTHQUAKES.find(x => x.id === row.dataset.id); if (q) renderDetail(q); }
    });

    /* ── Chips ── */

    document.querySelectorAll('.chip[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => {
          c.classList.remove('active');
          c.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        const filter = btn.dataset.filter;
        if (filter === 'all') renderTable(EARTHQUAKES);
        else if (filter === 'mag5') renderTable(filterData({ min_magnitude: 5 }), 'magnitude 5+', { min_magnitude: 5 });
        else if (filter === 'mag3') renderTable(filterData({ min_magnitude: 3 }), 'magnitude 3+', { min_magnitude: 3 });
        else if (filter === 'felt') renderTable(filterData({ felt: true }), 'felt earthquakes', { felt: true });
        else if (filter === 'recent') renderTable(filterData({ time_range: '24h' }), 'last 24 hours', { time_range: '24h' });
      });
    });

    document.querySelectorAll('.chip[data-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => {
          c.classList.remove('active');
          c.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        if (btn.dataset.view === 'chart') {
          const tiers = { minor: 0, moderate: 0, strong: 0, major: 0 };
          EARTHQUAKES.forEach(q => tiers[severityTier(q.magnitude)]++);
          renderEChart({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: ['Minor', 'Moderate', 'Strong', 'Major'] },
            yAxis: { type: 'value' },
            series: [{ type: 'bar', data: [
              { value: tiers.minor, itemStyle: { color: '#22c55e' } },
              { value: tiers.moderate, itemStyle: { color: '#f59e0b' } },
              { value: tiers.strong, itemStyle: { color: '#ef4444' } },
              { value: tiers.major, itemStyle: { color: '#ef4444' } }
            ] }]
          }, 'Magnitude distribution across all earthquakes');
        }
      });
    });

    /* ── Tool definitions ── */

    const TOOL_DEFS = [
      {
        name: 'filter_earthquakes',
        title: 'Filter Earthquakes',
        description: 'Filter and display earthquakes on the page. Renders a table showing matching earthquakes with magnitude, depth, time, and felt reports. The user can then click any row to see full details.',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: {
          type: 'object',
          properties: {
            min_magnitude: { type: 'number', description: 'Minimum magnitude threshold' },
            search: { type: 'string', description: 'Search by place name (partial match)' },
            time_range: { type: 'string', enum: ['24h', '7d', '30d'], description: 'Filter by time range' }
          }
        },
        exec: async (input) => {
          const filtered = filterData(input);
          const parts = [];
          if (input.min_magnitude) parts.push(`magnitude ${input.min_magnitude}+`);
          if (input.search) parts.push(`matching "${input.search}"`);
          if (input.time_range) parts.push(`last ${input.time_range}`);
          const label = parts.length ? parts.join(', ') : 'all earthquakes';
          renderTable(filtered, label, { min_magnitude: input.min_magnitude, time_range: input.time_range });
          return { displayed: true, count: filtered.length, summary: `Rendered ${filtered.length} earthquakes (${label}). User can now see the table and click any row for details.` };
        }
      },
      {
        name: 'show_earthquake_detail',
        title: 'Earthquake Detail',
        description: 'Display a detailed card for a specific earthquake, showing magnitude, depth, significance, felt reports, tsunami warning, and coordinates. Renders visually on the page.',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: {
          type: 'object',
          properties: {
            place: { type: 'string', description: 'Earthquake place name (partial match supported). Picks the strongest match if ambiguous.' }
          },
          required: ['place']
        },
        exec: async (input) => {
          const matches = EARTHQUAKES.filter(q => matchPlace(q, input.place));
          if (matches.length === 0) return { displayed: false, summary: `No earthquake found matching "${input.place}".` };
          const q = matches.sort((a, b) => b.magnitude - a.magnitude)[0];
          renderDetail(q);
          const tier = severityTier(q.magnitude);
          return { displayed: true, summary: `Showing ${q.place} — ${tier} (M${fmt(q.magnitude)}), depth ${fmt(q.depth)}km, significance ${q.significance}.` };
        }
      },
      {
        name: 'compare_earthquakes',
        title: 'Compare Earthquakes',
        description: 'Display a side-by-side comparison table of two earthquakes across key metrics: magnitude, depth, significance, felt reports, and tsunami warning.',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: {
          type: 'object',
          properties: {
            earthquake1: { type: 'string', description: 'First earthquake place name (partial match)' },
            earthquake2: { type: 'string', description: 'Second earthquake place name (partial match)' }
          },
          required: ['earthquake1', 'earthquake2']
        },
        exec: async (input) => {
          const m1 = EARTHQUAKES.filter(q => matchPlace(q, input.earthquake1));
          const m2 = EARTHQUAKES.filter(q => matchPlace(q, input.earthquake2));
          if (!m1.length) return { displayed: false, summary: `No earthquake found matching "${input.earthquake1}".` };
          if (!m2.length) return { displayed: false, summary: `No earthquake found matching "${input.earthquake2}".` };
          const q1 = m1.sort((a, b) => b.magnitude - a.magnitude)[0];
          const q2 = m2.sort((a, b) => b.magnitude - a.magnitude)[0];
          renderComparison(q1, q2);
          return { displayed: true, summary: `Comparing ${q1.place} (M${fmt(q1.magnitude)}) vs ${q2.place} (M${fmt(q2.magnitude)}).` };
        }
      },
      {
        name: 'render_chart',
        title: 'Render Chart',
        description: 'Render an Apache ECharts visualization. Generate a full ECharts option object with the appropriate chart type (bar, line, pie, scatter, radar, etc.) based on the data. Use the data available from previous tool calls. Colors should use the palette: ["#38bdf8", "#22c55e", "#f59e0b", "#ef4444", "#a78bfa", "#ec4899"].',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: {
          type: 'object',
          properties: {
            option: { type: 'object', description: 'Full ECharts option object (series, xAxis, yAxis, tooltip, legend, etc.)' },
            label: { type: 'string', description: 'Short description shown above the chart' }
          },
          required: ['option', 'label']
        },
        exec: async (input) => { renderEChart(input.option, input.label); return { displayed: true, summary: `Chart rendered: ${input.label}` }; }
      },
      {
        name: 'summarize_data',
        title: 'Summarize Data',
        description: 'Compute aggregate statistics for the earthquake dataset. Returns numerical summaries (count, max magnitude, average magnitude, average depth, most active region) without rendering any visualization.',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: {
          type: 'object',
          properties: { min_magnitude: { type: 'number', description: 'Only include earthquakes at or above this magnitude' } }
        },
        exec: async (input) => {
          const data = input.min_magnitude != null
            ? EARTHQUAKES.filter(q => q.magnitude >= input.min_magnitude)
            : EARTHQUAKES;
          if (data.length === 0) return { summary: 'No earthquakes match the given criteria.' };
          const avg = (fn) => data.reduce((s, q) => s + fn(q), 0) / data.length;
          const avgMag = avg(q => q.magnitude);
          const avgDepth = avg(q => q.depth);
          const maxMag = Math.max(...data.map(q => q.magnitude));
          const strongest = data.find(q => q.magnitude === maxMag);
          const regionCounts = {};
          data.forEach(q => { regionCounts[q.region] = (regionCounts[q.region] || 0) + 1; });
          const mostActive = Object.entries(regionCounts).sort((a, b) => b[1] - a[1])[0];
          const scope = input.min_magnitude != null ? `magnitude ${input.min_magnitude}+` : 'all earthquakes';
          return {
            scope, count: data.length,
            maxMagnitude: maxMag,
            avgMagnitude: +avgMag.toFixed(2),
            avgDepth: +avgDepth.toFixed(1),
            strongestQuake: { place: strongest.place, magnitude: strongest.magnitude },
            mostActiveRegion: mostActive ? { region: mostActive[0], count: mostActive[1] } : null,
            summary: `${data.length} earthquakes (${scope}): max magnitude ${maxMag}, avg magnitude ${avgMag.toFixed(1)}, avg depth ${avgDepth.toFixed(0)}km. Strongest: ${strongest.place} (M${maxMag}). Most active region: ${mostActive ? mostActive[0] + ' (' + mostActive[1] + ')' : 'N/A'}.`
          };
        }
      },
      {
        name: 'flag_earthquake',
        title: 'Flag Earthquake',
        description: 'Flag or unflag an earthquake with a note. Flagged earthquakes display an amber indicator dot in tables and detail views. Use this to mark earthquakes that warrant attention.',
        readOnlyHint: false, idempotentHint: false, destructiveHint: false, openWorldHint: false,
        schema: {
          type: 'object',
          properties: {
            place: { type: 'string', description: 'Earthquake place name (partial match supported)' },
            note: { type: 'string', description: 'Reason for flagging (displayed on detail card)' },
            unflag: { type: 'boolean', description: 'Set to true to remove the flag' }
          },
          required: ['place']
        },
        exec: async (input) => {
          const matches = EARTHQUAKES.filter(q => matchPlace(q, input.place));
          if (!matches.length) return { summary: `No earthquake found matching "${input.place}".` };
          const q = matches.sort((a, b) => b.magnitude - a.magnitude)[0];

          if (input.unflag) {
            const previous = flaggedQuakes.get(q.id);
            flaggedQuakes.delete(q.id);
            persistFlags();
            refreshCurrentView();
            runtime?.refresh();
            showToast('Flag removed', () => {
              flaggedQuakes.set(q.id, previous || { note: 'Flagged for review', timestamp: Date.now() });
              persistFlags();
              refreshCurrentView();
              runtime?.refresh();
            });
            return { summary: `Removed flag from ${q.place}.` };
          }

          let note = input.note;
          if (!note) note = await showPromptDialog(`Add a note for flagging ${q.place} (optional)`);
          const flagData = { note: note || 'Flagged for review', timestamp: Date.now() };
          flaggedQuakes.set(q.id, flagData);
          persistFlags();
          refreshCurrentView();
          runtime?.refresh();
          showToast('Earthquake flagged', () => {
            flaggedQuakes.delete(q.id);
            persistFlags();
            refreshCurrentView();
            runtime?.refresh();
          });
          return { summary: `Flagged ${q.place}: "${flagData.note}".` };
        }
      },
      {
        name: 'export_flagged',
        title: 'Export Flagged',
        description: 'Download a CSV file of all currently flagged earthquakes with their flag notes and key metrics. Produces a file download.',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: { type: 'object', properties: {} },
        exec: async () => {
          if (flaggedQuakes.size === 0) return { summary: 'No earthquakes are currently flagged.' };
          const headers = ['Place', 'Magnitude', 'Depth', 'Significance', 'Felt', 'Tsunami', 'Time', 'Flag Note', 'Flagged At'];
          const rows = [...flaggedQuakes.entries()].map(([id, flag]) => {
            const q = EARTHQUAKES.find(x => x.id === id);
            return [q.place, q.magnitude, q.depth, q.significance, q.felt, q.tsunami, new Date(q.time).toISOString(), flag.note, new Date(flag.timestamp).toISOString()];
          });
          const csv = [headers, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
          const blob = new Blob([csv], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'flagged-earthquakes.csv';
          a.click();
          URL.revokeObjectURL(url);
          return { summary: `Exported ${flaggedQuakes.size} flagged earthquake(s) as CSV.` };
        }
      }
    ];

    /* ── Dynamic + adjusted tools ── */
    //
    // There is no system prompt here — nothing sends one anywhere. Per-tool
    // guidance lives on each tool's own description (e.g. render_chart's
    // palette line, below); a native WebMCP agent reads descriptions, never
    // a page-level prompt, so cross-tool tone or chaining guidance has
    // nowhere to live and is simply left unstated.

    function getDynamicTools() {
      if (flaggedQuakes.size === 0) return [];
      return [
        {
          name: 'review_flags',
          title: 'Review Flags',
          description: `Show all ${flaggedQuakes.size} currently flagged earthquakes with their notes and magnitude.`,
          readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
          schema: { type: 'object', properties: {} },
          exec: async () => {
            const flagged = [...flaggedQuakes.keys()].map(id => EARTHQUAKES.find(q => q.id === id)).filter(Boolean);
            renderTable(flagged, 'flagged earthquakes');
            return {
              displayed: true, count: flagged.length,
              summary: `Showing ${flagged.length} flagged earthquake(s).`,
              earthquakes: flagged.map(q => ({ place: q.place, note: flaggedQuakes.get(q.id).note, magnitude: q.magnitude }))
            };
          }
        },
        {
          name: 'clear_all_flags',
          title: 'Clear All Flags',
          description: `Remove all ${flaggedQuakes.size} earthquake flags. This action cannot be undone.`,
          readOnlyHint: false, idempotentHint: true, destructiveHint: true, openWorldHint: false,
          schema: { type: 'object', properties: {} },
          exec: async () => {
            // Nothing outside this function gates destructive tools — the
            // confirm lives here, unconditionally, on every call.
            const count = flaggedQuakes.size;
            const ok = await showConfirmDialog('Clear All Flags', { count });
            if (!ok) return { summary: 'Cancelled — flags left in place.' };
            flaggedQuakes.clear();
            persistFlags();
            refreshCurrentView();
            runtime?.refresh();
            return { summary: `Cleared ${count} flag(s).` };
          }
        }
      ];
    }

    function adjustTool(t) {
      if (t.name !== 'compare_earthquakes') return t;
      const visible = (currentView.type === 'table' && currentView.data) ? currentView.data : EARTHQUAKES;
      const places = visible.slice(0, 50).map(q => q.place);
      return {
        ...t,
        schema: {
          ...t.schema,
          properties: {
            earthquake1: { ...t.schema.properties.earthquake1, enum: places },
            earthquake2: { ...t.schema.properties.earthquake2, enum: places }
          }
        }
      };
    }

    /* ── Mount ── */

    // Declared before mount(), which renders the source bar synchronously —
    // a `let` read from inside that first render would hit its dead zone.
    let SOURCE = null;

    runtime = mount({
      tools: TOOL_DEFS,
      getDynamicTools,
      adjustTool,
      dataSource: () => SOURCE,
    });

    /* ── Init ── */

    async function init() {
      renderSkeleton();
      try {
        const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const geojson = await res.json();
        EARTHQUAKES = geojson.features.map(f => ({
          id: f.id,
          place: f.properties.place || 'Unknown',
          magnitude: f.properties.mag || 0,
          depth: f.geometry.coordinates[2] || 0,
          time: f.properties.time,
          type: f.properties.type || 'earthquake',
          status: f.properties.status || 'automatic',
          tsunami: f.properties.tsunami === 1,
          felt: f.properties.felt || 0,
          significance: f.properties.sig || 0,
          lat: f.geometry.coordinates[1],
          lon: f.geometry.coordinates[0],
          region: extractRegion(f.properties.place)
        })).sort((a, b) => b.time - a.time);

        // The window is whatever the feed actually returned, read off the
        // rows — "last 30 days" is the feed's promise, not a measurement.
        // The unreviewed count comes from a field the page already parses
        // and, until now, showed only on a detail card: an automatic
        // solution is a machine's first guess, and it moves.
        const span = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        const unreviewed = EARTHQUAKES.filter(q => q.status !== 'reviewed').length;
        SOURCE = {
          publisher: 'USGS',
          dataset: 'Earthquake Hazards Program — all earthquakes, past 30 days',
          url: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson',
          rows: `${EARTHQUAKES.length.toLocaleString()} events`,
          coverage: EARTHQUAKES.length
            ? `${span(EARTHQUAKES.at(-1).time)} – ${span(EARTHQUAKES[0].time)}`
            : null,
          retrieved: Date.now(),
          caveat: unreviewed
            ? `${unreviewed.toLocaleString()} of these are automatic solutions no seismologist has reviewed yet. Magnitude, depth and location can still change.`
            : null,
        };
      } catch (err) {
        display.innerHTML = `<p class="msg-error">Failed to load earthquake data: ${err.message}</p>`;
        return;
      }
      loadFlags();
      if (!decodeHashToView()) renderTable(EARTHQUAKES);
    }

    init();
  </script>
</body>
</html>
