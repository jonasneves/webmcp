<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#e8ebf2">
  <title>WebMCP PoC — World Development</title>
  <link rel="stylesheet" href="../app.css">
  <link rel="stylesheet" href="../chat.css">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js" as="script">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" as="script">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js" as="script">
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <div class="main-column">
    <header>
      <div class="header-left">
        <h1><a class="home-link" href="../">WebMCP PoC</a></h1>
        <button class="tools-toggle" id="tools-toggle" aria-expanded="false" aria-controls="tools-panel">&#9660; 10 tools</button>
      </div>
      <div class="settings-wrap">
        <button class="settings-btn" id="settings-btn" aria-label="Settings" aria-expanded="false" aria-controls="settings-popover" title="Settings">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
            <path d="M6.08 1.5a.5.5 0 0 0-.495.43l-.198 1.382a4.5 4.5 0 0 0-.968.565L3.1 3.29a.5.5 0 0 0-.617.172L1.5 4.9a.5.5 0 0 0 .1.657l1.1.9A4.5 4.5 0 0 0 2.6 7.5c0 .328.034.648.1.943l-1.1.9a.5.5 0 0 0-.1.657l.984 1.438a.5.5 0 0 0 .617.172l1.319-.588c.298.213.617.398.968.565l.198 1.383a.5.5 0 0 0 .495.43h1.84a.5.5 0 0 0 .495-.43l.198-1.383a4.5 4.5 0 0 0 .968-.565l1.319.588a.5.5 0 0 0 .617-.172L13.4 10a.5.5 0 0 0-.1-.657l-1.1-.9c.066-.295.1-.615.1-.943s-.034-.648-.1-.943l1.1-.9A.5.5 0 0 0 13.5 4.9l-.984-1.438a.5.5 0 0 0-.617-.172l-1.319.588a4.5 4.5 0 0 0-.968-.565L9.415 1.93A.5.5 0 0 0 8.92 1.5H6.08ZM7.5 9.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z" fill="currentColor"/>
          </svg>
        </button>
        <div class="settings-popover" id="settings-popover" hidden role="dialog" aria-label="Settings">

          <div class="settings-section">
            <div class="settings-section-label">Appearance</div>
            <div class="theme-toggle" role="group" aria-label="Color theme">
              <button class="theme-opt" data-theme="system">System</button>
              <button class="theme-opt" data-theme="light">Light</button>
              <button class="theme-opt" data-theme="dark">Dark</button>
            </div>
          </div>

          <div class="settings-section">
            <div class="settings-section-label">AI Model</div>
            <select class="chat-model-select" id="model-select" aria-label="Model">
              <option value="anthropic:claude-haiku-4-5">Claude Haiku 4.5</option>
              <option value="anthropic:claude-sonnet-5">Claude Sonnet 5</option>
              <option value="anthropic:claude-opus-5">Claude Opus 5</option>
              <option value="local:claude" hidden>Claude &middot; Personal account</option>
              <option value="termd:agent" hidden>termd &middot; local agent</option>
              <option value="github:openai/gpt-4.1">GitHub &middot; GPT-4.1</option>
              <option value="github:openai/gpt-4.1-mini">GitHub &middot; GPT-4.1 mini</option>
              <option value="github:openai/gpt-5">GitHub &middot; GPT-5</option>
              <option value="github:openai/gpt-5-mini">GitHub &middot; GPT-5 mini</option>
              <option value="openai:gpt-4.1">OpenAI &middot; GPT-4.1</option>
              <option value="openai:gpt-4.1-mini">OpenAI &middot; GPT-4.1 mini</option>
              <option value="openai:gpt-5">OpenAI &middot; GPT-5</option>
              <option value="openai:gpt-5-mini">OpenAI &middot; GPT-5 mini</option>
            </select>
          </div>

          <form class="settings-section" id="chat-claude-bar" onsubmit="event.preventDefault()">
            <div class="settings-section-label">Anthropic API Key</div>
            <div class="settings-auth-row">
              <input type="password" class="chat-auth-input" id="api-key" placeholder="sk-ant-&#8230;" autocomplete="off" aria-label="Anthropic API key">
              <button type="submit" class="btn btn-sm" id="key-save">Save</button>
            </div>
          </form>

          <div class="settings-section" id="chat-openai-bar" hidden>
            <div class="settings-section-label">OpenAI API Key</div>
            <div class="settings-auth-row">
              <input type="password" class="chat-auth-input" id="openai-key" placeholder="sk-&#8230;" autocomplete="off" aria-label="OpenAI API key">
            </div>
          </div>

          <div class="settings-section" id="github-auth-bar">
            <!-- rendered by updateGitHubAuthBar() -->
          </div>

          <div class="github-notice settings-notice" id="github-notice" hidden>
            <span>&#9888; Tool calls may be less reliable with GitHub Models than with Claude.</span>
            <button class="github-notice-dismiss" id="github-notice-dismiss" aria-label="Dismiss">&#x2715;</button>
          </div>

        </div>
      </div>
    </header>

    <div class="tools-panel" id="tools-panel" data-collapsed="true">
      <div class="tools-panel-inner" id="tools-panel-inner"></div>
    </div>

    <main>
      <nav class="controls" aria-label="Views and filters">
        <button class="chip" aria-pressed="true" data-filter="all">All</button>
        <button class="chip" aria-pressed="false" data-filter="Sub-Saharan Africa">Sub-Saharan Africa</button>
        <button class="chip" aria-pressed="false" data-filter="Europe &amp; Central Asia">Europe &amp; C. Asia</button>
        <button class="chip" aria-pressed="false" data-filter="East Asia &amp; Pacific">East Asia &amp; Pacific</button>
        <button class="chip" aria-pressed="false" data-filter="Latin America &amp; Caribbean">Latin America</button>
        <button class="chip" aria-pressed="false" data-filter="Middle East, North Africa, Afghanistan &amp; Pakistan">Middle East &amp; N. Africa</button>
        <button class="chip" aria-pressed="false" data-filter="South Asia">South Asia</button>
        <button class="chip" aria-pressed="false" data-filter="North America">North America</button>
        <button class="chip" aria-pressed="false" data-income="High income">High income</button>
        <button class="chip" aria-pressed="false" data-view="scatter">Development scatter</button>
      </nav>

      <div id="display"></div>
    </main>
  </div>

  <aside class="chat-panel">
    <div class="chat-header">
      <span class="chat-header-title">AI Chat</span>
      <span class="chat-model-label" id="chat-model-label">Claude</span>
      <button class="btn btn-sm" id="chat-reset" aria-label="Clear chat">Clear</button>
    </div>
    <div class="chat-messages" id="chat-messages" aria-live="polite" aria-label="Chat messages"></div>
    <div class="chat-input-area">
      <div class="chat-input-wrap">
        <textarea class="chat-input" id="chat-input" placeholder="Ask about world development&#8230;" rows="1" aria-label="Chat message"></textarea>
        <button class="chat-send-btn" id="chat-send" aria-label="Send message" title="Send">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="chat-abort-btn" id="chat-abort" hidden aria-label="Stop generating" title="Stop">
          <svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true">
            <rect width="11" height="11" rx="2" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <p class="dialog-title" id="confirm-title">Confirm action</p>
      <p class="dialog-tool" id="confirm-tool"></p>
      <p class="dialog-args" id="confirm-args"></p>
      <div class="dialog-actions">
        <button class="btn-cancel" value="cancel">Cancel</button>
        <button class="btn-confirm" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>

  <dialog id="prompt-dialog" aria-labelledby="prompt-title">
    <form method="dialog">
      <p class="dialog-title" id="prompt-title"></p>
      <input type="text" class="dialog-input" id="prompt-input" autocomplete="off">
      <div class="dialog-actions">
        <button class="btn-cancel" value="cancel">Skip</button>
        <button class="btn-confirm" value="confirm">Add</button>
      </div>
    </form>
  </dialog>

  <script>
    (function () {
      const stored = localStorage.getItem('webmcp-theme') || 'light';
      const resolved = stored === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : stored;
      document.documentElement.dataset.theme = resolved;
    })();
  </script>
  <script type="module">
    import { mount, showToast, showConfirmDialog, showPromptDialog, appendMessage } from '../runtime/index.js';

    marked.use({ gfm: true, breaks: true });

    /* ── State ── */

    let COUNTRIES = [];
    const flaggedCountries = new Map();
    let currentView = { type: 'table', data: null, label: null, filters: null };
    let chartInstance = null;

    /* ── Utilities ── */

    const sizeTier = (p) => p >= 50_000_000 ? 'large' : p >= 10_000_000 ? 'medium' : 'small';
    const matchName = (c, q) => c.name.toLowerCase().includes(q.toLowerCase());

    const CO2_INDICATOR = 'EN.GHG.CO2.PC.CE.AR5';

    /* Every metric the page can table, chart, rank or plot over time. Adding a
     * row here is enough to make it reachable from all of them, and from the
     * tools the model calls — the enum below is generated from these keys. */
    const INDICATORS = {
      population:     { id: 'SP.POP.TOTL',    label: 'Population',               fmt: v => Math.round(v).toLocaleString() },
      gdpPerCapita:   { id: 'NY.GDP.PCAP.CD', label: 'GDP per capita (US$)',     fmt: v => '$' + Math.round(v).toLocaleString() },
      lifeExpectancy: { id: 'SP.DYN.LE00.IN', label: 'Life expectancy (years)',  fmt: v => v.toFixed(1) },
      fertility:      { id: 'SP.DYN.TFRT.IN', label: 'Fertility (births/woman)', fmt: v => v.toFixed(2) },
      internet:       { id: 'IT.NET.USER.ZS', label: 'Internet users (%)',       fmt: v => v.toFixed(1) + '%' },
      co2PerCapita:   { id: CO2_INDICATOR,    label: 'CO₂ per capita (tonnes)',  fmt: v => v.toFixed(2) },
    };
    const METRIC_KEYS = Object.keys(INDICATORS);

    /* World Bank's own groupings, spelled exactly as the API returns them —
     * these strings are the filter values, so a paraphrase silently matches
     * nothing. Both are offered to the model as enums. */
    const REGIONS = [
      'East Asia & Pacific', 'Europe & Central Asia', 'Latin America & Caribbean',
      'Middle East, North Africa, Afghanistan & Pakistan', 'North America',
      'South Asia', 'Sub-Saharan Africa',
    ];
    const INCOME_LEVELS = ['High income', 'Upper middle income', 'Lower middle income', 'Low income'];

    /* Display-only shortening. The full strings above stay the filter values —
     * "Middle East, North Africa, Afghanistan & Pakistan" in a table cell forces
     * the row wide enough to push the last column off the edge. */
    const SHORT_REGION = {
      'Middle East, North Africa, Afghanistan & Pakistan': 'Middle East & N. Africa',
      'Latin America & Caribbean': 'Latin America',
      'Europe & Central Asia': 'Europe & C. Asia',
    };
    const shortRegion = (r) => SHORT_REGION[r] || r;

    /* World Bank answers [meta, rows], sometimes with a leading UTF-8 BOM that
     * JSON.parse rejects, and reports errors as [{message:[{value}]}] under a
     * 200. Normalise all three here so callers only ever see rows. */
    async function wbFetch(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const body = JSON.parse((await res.text()).replace(/^\uFEFF/, ''));
      if (body?.[0]?.message) throw new Error(body[0].message[0]?.value || 'World Bank error');
      return body[1] || [];
    }

    const filterData = ({ region, income, size, search } = {}) =>
      COUNTRIES.filter(c => {
        if (region && c.region !== region) return false;
        if (income && c.income !== income) return false;
        if (size && sizeTier(c.population) !== size) return false;
        if (search && !matchName(c, search)) return false;
        return true;
      });

    /* ── Persistence ── */

    function persistFlags() {
      const data = [...flaggedCountries.entries()].map(([name, flag]) => ({ name, ...flag }));
      localStorage.setItem('webmcp-country-flags', JSON.stringify(data));
    }
    function loadFlags() {
      try {
        const data = JSON.parse(localStorage.getItem('webmcp-country-flags') || '[]');
        data.forEach(({ name, ...flag }) => flaggedCountries.set(name, flag));
      } catch (err) {
        console.warn('Discarding corrupted webmcp-country-flags:', err);
        localStorage.removeItem('webmcp-country-flags');
      }
    }

    /* ── ECharts theme ── */

    const display = document.getElementById('display');

    echarts.registerTheme('webmcp', {
      backgroundColor: 'transparent',
      textStyle: { fontFamily: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" },
      title: { textStyle: { color: '#f1f5f9' } },
      legend: { textStyle: { color: '#94a3b8' } },
      categoryAxis: { axisLine: { lineStyle: { color: '#475569' } }, axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#1e293b' } } },
      valueAxis: { axisLine: { lineStyle: { color: '#475569' } }, axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#1e293b' } } },
      tooltip: { backgroundColor: '#1e293b', borderColor: '#475569', textStyle: { color: '#f1f5f9' } }
    });

    window.addEventListener('resize', () => chartInstance?.resize());

    /* ── Renderers ── */

    let runtime;

    function renderSkeleton() {
      display.innerHTML = `<div class="loading-skeleton">${Array.from({length:8},(_,i)=>`<div class="skeleton-row" style="animation-delay: ${i * 80}ms"></div>`).join('')}</div>`;
    }

    function renderTable(countries, label, filters) {
      currentView = { type: 'table', data: countries, label, filters };
      const summary = label || `${countries.length} countries`;

      if (countries.length === 0) {
        display.innerHTML = `<p class="empty-state">No countries match the current filters.</p>`;
        encodeViewToHash(); runtime?.refresh();
        return;
      }

      display.innerHTML = `
        <div class="summary-row">
          <p class="view-label">Showing ${summary}</p>
          <span class="summary-count">${countries.length} result${countries.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr><th>Country</th><th>Region</th><th>Income group</th><th>Population</th><th>GDP per capita</th><th>Life expectancy</th></tr>
          </thead>
          <tbody>
            ${countries.map(c => {
              const isFlagged = flaggedCountries.has(c.name);
              const cell = (k) => c[k] == null ? '<span class="detail-suffix">—</span>' : INDICATORS[k].fmt(c[k]);
              return `<tr tabindex="0" data-name="${c.name}">
                <td><span class="name-cell">${isFlagged ? '<span class="flag-dot" title="Flagged"></span>' : ''}${c.name}</span></td>
                <td>${shortRegion(c.region)}</td>
                <td>${c.income}</td>
                <td>${cell('population')}</td>
                <td>${cell('gdpPerCapita')}</td>
                <td>${cell('lifeExpectancy')}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        </div>
      `;
      encodeViewToHash(); runtime?.refresh();
    }

    const REGION_COLORS = {
      'Sub-Saharan Africa': '#fb923c',
      'Europe & Central Asia': '#a78bfa',
      'East Asia & Pacific': '#f59e0b',
      'Latin America & Caribbean': '#38bdf8',
      'Middle East, North Africa, Afghanistan & Pakistan': '#f472b6',
      'South Asia': '#22c55e',
      'North America': '#2dd4bf',
    };

    /* Wealth against lifespan, one bubble per country, sized by population and
     * coloured by region — the shape Hans Rosling made famous. GDP spans four
     * orders of magnitude, so the x axis is logarithmic; on a linear axis every
     * country below ~$20k collapses into the left margin. */
    function renderScatter(countries = COUNTRIES, label) {
      const pts = countries.filter(c => c.gdpPerCapita && c.lifeExpectancy && c.population);
      const maxPop = Math.max(...pts.map(c => c.population));
      renderEChart({
        grid: { left: 60, right: 56, top: 24, bottom: 56 },  /* room for the "1,000,000" tick */
        tooltip: {
          trigger: 'item',
          formatter: (p) => {
            const c = p.data.country;
            return `<strong>${c.name}</strong><br>${c.region}<br>`
              + `GDP/capita: ${INDICATORS.gdpPerCapita.fmt(c.gdpPerCapita)}<br>`
              + `Life expectancy: ${INDICATORS.lifeExpectancy.fmt(c.lifeExpectancy)}<br>`
              + `Population: ${INDICATORS.population.fmt(c.population)}`;
          },
        },
        xAxis: { type: 'log', name: 'GDP per capita (US$)', nameLocation: 'middle', nameGap: 32 },
        yAxis: { type: 'value', name: 'Life expectancy (years)', nameLocation: 'middle', nameGap: 40, min: 40 },
        series: [{
          type: 'scatter',
          data: pts.map(c => ({
            value: [c.gdpPerCapita, c.lifeExpectancy],
            country: c,
            symbolSize: Math.max(6, Math.sqrt(c.population / maxPop) * 60),
            itemStyle: { color: REGION_COLORS[c.region] || '#94a3b8', opacity: 0.75 },
          })),
        }],
      }, label || `Wealth vs lifespan — ${pts.length} countries, bubble size is population`);
    }

    function renderEChart(option, label) {
      currentView = { type: 'chart', data: option, label, filters: {} };
      if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
      display.innerHTML = `<p class="view-label">${label}</p><div id="chart-container" class="chart-container"></div>`;
      chartInstance = echarts.init(document.getElementById('chart-container'), 'webmcp');
      chartInstance.setOption(option);
      encodeViewToHash(); runtime?.refresh();
    }

    function renderDetail(country) {
      const c = country;
      const flag = flaggedCountries.get(c.name);
      currentView = { type: 'detail', data: c, label: null, filters: null };
      const escape = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

      display.innerHTML = `
        <button class="back-btn">&#8592; Back to list</button>
        <div class="detail-card">
          <div class="detail-header">
            <h2>${flag ? '<span class="flag-dot"></span>' : ''}${c.name}</h2>
            <p class="detail-meta">${c.region} &middot; ${c.income} &middot; ${c.capital}</p>
          </div>
          ${flag ? `<p class="flag-note">${escape(flag.note)}</p>` : ''}
          <div class="detail-grid">
            ${METRIC_KEYS.map(k => {
              const v = c[k], yr = c[`${k}Year`];
              return `<div class="detail-cell">
                <div class="detail-cell-label">${INDICATORS[k].label}</div>
                <div class="detail-cell-value">${v == null ? '—' : INDICATORS[k].fmt(v)}${yr ? `<span class="detail-suffix"> (${yr})</span>` : ''}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      `;
      encodeViewToHash(); runtime?.refresh();
    }

    function renderComparison(c1, c2) {
      currentView = { type: 'comparison', data: [c1, c2], label: null, filters: null };
      const metrics = METRIC_KEYS.map(k => ({
        label: INDICATORS[k].label, key: k,
        format: v => v == null ? '—' : INDICATORS[k].fmt(v),
      }));
      display.innerHTML = `
        <button class="back-btn">&#8592; Back to list</button>
        <p class="view-label">Comparing two countries</p>
        <table class="compare-table">
          <thead><tr><th>Metric</th><th>${c1.name}</th><th>${c2.name}</th></tr></thead>
          <tbody>
            ${metrics.map(m => `<tr>
              <td class="compare-metric">${m.label}</td>
              <td class="compare-value">${m.format(c1[m.key])}</td>
              <td class="compare-value">${m.format(c2[m.key])}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      `;
      encodeViewToHash(); runtime?.refresh();
    }

    function refreshCurrentView() {
      if (currentView.type === 'table') renderTable(currentView.data || COUNTRIES, currentView.label, currentView.filters);
      else if (currentView.type === 'chart' && currentView.data) renderEChart(currentView.data, currentView.label);
      else if (currentView.type === 'detail' && currentView.data) renderDetail(currentView.data);
      else if (currentView.type === 'comparison' && currentView.data) renderComparison(currentView.data[0], currentView.data[1]);
    }

    /* ── Hash routing ── */

    function encodeViewToHash() {
      const params = new URLSearchParams();
      params.set('view', currentView.type);
      const f = currentView.filters || {};
      if (currentView.type === 'table') {
        if (f.region) params.set('region', f.region);
        if (f.size) params.set('size', f.size);
      } else if (currentView.type === 'detail' && currentView.data) {
        params.set('name', currentView.data.name);
      } else if (currentView.type === 'comparison' && currentView.data) {
        params.set('c1', currentView.data[0].name);
        params.set('c2', currentView.data[1].name);
      }
      history.replaceState(null, '', '#' + params.toString());
    }

    function decodeHashToView() {
      const hash = location.hash.slice(1);
      if (!hash) return false;
      const params = new URLSearchParams(hash);
      const view = params.get('view');

      if (view === 'table') {
        const region = params.get('region');
        const size = params.get('size');
        if (region) renderTable(filterData({ region }), `countries in ${region}`, { region });
        else if (size) renderTable(filterData({ size }), `${size} countries`, { size });
        else renderTable(COUNTRIES);
        return true;
      }
      if (view === 'chart') { renderTable(COUNTRIES); return true; }
      if (view === 'detail') {
        const c = COUNTRIES.find(c => c.name === params.get('name'));
        if (c) { renderDetail(c); return true; }
      }
      if (view === 'comparison') {
        const c1 = COUNTRIES.find(c => c.name === params.get('c1'));
        const c2 = COUNTRIES.find(c => c.name === params.get('c2'));
        if (c1 && c2) { renderComparison(c1, c2); return true; }
      }
      return false;
    }

    window.addEventListener('hashchange', () => { if (COUNTRIES.length) decodeHashToView(); });

    /* ── Display events ── */

    display.addEventListener('click', (e) => {
      const row = e.target.closest('tr[data-name]');
      if (row) { const c = COUNTRIES.find(x => x.name === row.dataset.name); if (c) renderDetail(c); return; }
      if (e.target.closest('.back-btn')) renderTable(COUNTRIES);
    });
    display.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const row = e.target.closest('tr[data-name]');
      if (row) { const c = COUNTRIES.find(x => x.name === row.dataset.name); if (c) renderDetail(c); }

    /* ── Chips ── */

    /* Exactly one chip is selected at a time, and the selection has to be
     * readable by assistive tech, not just styled — so aria-pressed moves with
     * the class. One helper keeps the three handlers from drifting apart. */
    function setPressed(btn) {
      document.querySelectorAll('.chip').forEach(c => {
        c.classList.remove('active');
        c.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
    }

    document.querySelectorAll('.chip[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        setPressed(btn);
        const filter = btn.dataset.filter;
        if (filter === 'all') renderTable(COUNTRIES);
        else if (filter === 'large') renderTable(filterData({ size: 'large' }), 'large countries (50M+ population)', { size: 'large' });
        else renderTable(filterData({ region: filter }), `countries in ${filter}`, { region: filter });
      });
    });

    document.querySelectorAll('.chip[data-income]').forEach(btn => {
      btn.addEventListener('click', () => {
        setPressed(btn);
        const income = btn.dataset.income;
        renderTable(filterData({ income }), `${income} countries`, { income });
      });
    });

    document.querySelectorAll('.chip[data-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        setPressed(btn);
        if (btn.dataset.view === 'scatter') renderScatter();
      });
    });

      {
        name: 'show_country_trend',
        title: 'Show Country Trend',
        description: 'Chart how one indicator changed over time for one or more countries, back to 1960. This is the only tool that fetches beyond the loaded snapshot, so use it for questions about change, trajectory, or "when did X overtake Y".',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: true,

          },

        exec: async (input) => {
          const meta = INDICATORS[input.metric];
          if (!meta) return { error: `Unknown metric "${input.metric}".` };

      {
        name: 'summarize_data',
        title: 'Summarize Data',
        description: 'Compute aggregates over the country set: count, total population, and population-weighted GDP per capita and life expectancy, plus largest and smallest. Returns numbers only, renders nothing.',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: {
          type: 'object',
          properties: { region: { type: 'string', enum: REGIONS, description: 'Limit summary to a specific region' } }

          const data = input.region ? filterData({ region: input.region }) : COUNTRIES;
          if (data.length === 0) return { summary: `No countries found for region "${input.region}".` };
          const totalPop = data.reduce((s, c) => s + c.population, 0);
          // Averaging a per-capita indicator across countries un-weighted would
          // let Tuvalu count as much as India, so weight each by population.
          const weighted = (key) => {
            const rows = data.filter(c => c[key] != null);
            if (!rows.length) return null;
            const pop = rows.reduce((s, c) => s + c.population, 0);
            return rows.reduce((s, c) => s + c[key] * c.population, 0) / pop;

          const gdp = weighted('gdpPerCapita');
          const life = weighted('lifeExpectancy');
          const byPop = [...data].sort((a, b) => b.population - a.population);

          const scope = input.region || 'all regions';
          return {

            populationWeightedGdpPerCapita: gdp,

              + (life ? `, life expectancy ${INDICATORS.lifeExpectancy.fmt(life)}` : '')

    /* ── System prompt + page context ── */

    const SYSTEM_PROMPT_BASE = `You are embedded in a WebMCP proof-of-concept that explores world country data. Your tools render visuals (tables, charts, detail cards, comparisons) directly on the page \u2014 the user already sees the full result. You only receive a brief summary.

Rules:
- Chain tools proactively \u2014 don't announce what you're about to do, just do it. Call multiple tools in sequence to fully answer a question.
- For analysis or "compare regions" requests: call summarize_data first for raw numbers, then filter or chart as needed.
- For "what's interesting / notable" questions: summarize_data \u2192 render a chart showing the key distribution \u2192 note the standout outlier.
- Infer intent from context. Viewing a detail card + "compare it" \u2192 compare with the most similar or most contrasting country. Viewing a filtered table + "chart it" \u2192 render a chart of the visible data.
- Be concise: 1-2 sentences after a single tool call. 2-4 sentences after a multi-tool chain \u2014 add insight the visualization doesn't already show. Always end with one specific next-step suggestion.
- No markdown formatting \u2014 plain text only. No greetings, filler, or preamble.
- All tools run immediately \u2014 do not ask permission before calling them. Only flag_country may request a user note via interaction.
- Use summarize_data to compute aggregate statistics before writing analysis. Returns numbers without rendering.
- Use render_chart for Apache ECharts visualizations. Generate a full ECharts option object with the best chart type. Palette: ["#38bdf8", "#22c55e", "#f59e0b", "#ef4444", "#a78bfa", "#ec4899"]. backgroundColor is transparent.
- Your available tools change dynamically based on page state. When countries are flagged, review_flags and clear_all_flags become available.`;

    function getSystemPrompt() {
      const lines = [SYSTEM_PROMPT_BASE, '', 'Current page state:'];
      switch (currentView.type) {
        case 'table': {
          const data = currentView.data || COUNTRIES;
          lines.push(`- Viewing: table of ${data.length} countries`);
          const names = data.slice(0, 8).map(c => c.name);
          lines.push(`- Visible: ${names.join(', ')}${data.length > 8 ? ` (+${data.length - 8} more)` : ''}`);
          break;
        }
        case 'detail':
          if (currentView.data) {
            const c = currentView.data;
            lines.push(`- Viewing: detail card for ${c.name} (${c.region}, population: ${c.population.toLocaleString()}, income group: ${c.income})`);
          }
          break;
        case 'chart': lines.push('- Viewing: region distribution chart'); break;
        case 'comparison':
          if (currentView.data) lines.push(`- Viewing: comparison of ${currentView.data[0].name} vs ${currentView.data[1].name}`);
          break;
      }
      if (currentView.filters?.region) lines.push(`- Filtered by region: ${currentView.filters.region}`);
      if (currentView.filters?.size) lines.push(`- Filtered by size: ${currentView.filters.size}`);
      if (flaggedCountries.size > 0) lines.push(`- Flagged countries (${flaggedCountries.size}): ${[...flaggedCountries.keys()].join(', ')}`);
      return lines.join('\n');
    }

    function getDividerContext() {
      const parts = [];
      switch (currentView.type) {
        case 'table': parts.push('Table'); if (currentView.data) parts.push(`${currentView.data.length} countries`); break;
        case 'chart': parts.push('Chart'); break;
        case 'detail': if (currentView.data) parts.push(`Detail: ${currentView.data.name}`); break;
        case 'comparison': if (currentView.data) parts.push(`${currentView.data[0].name} vs ${currentView.data[1].name}`); break;
      }
      if (currentView.filters?.region) parts.push(currentView.filters.region);
      if (currentView.filters?.size) parts.push(`${currentView.filters.size} countries`);
      if (flaggedCountries.size > 0) parts.push(`${flaggedCountries.size} flagged`);
      return parts;
    }

    function getFollowupSuggestions() {
      switch (currentView.type) {
        case 'table': {
          const out = ['Show population chart'];
          const large = (currentView.data || COUNTRIES)
            .filter(c => sizeTier(c.population) === 'large')
            .sort((a, b) => b.population - a.population);
          if (large.length >= 2) out.push(`Compare ${large[0].name} and ${large[1].name}`);
          return out;
        }
        case 'chart': return ['Show table view', 'Filter to large countries only'];
        case 'detail': {
          const c = currentView.data;
          const out = [`Flag ${c.name}`];
          const sameRegion = COUNTRIES
            .filter(o => o.name !== c.name && o.region === c.region)
            .sort((a, b) => Math.abs(a.population - c.population) - Math.abs(b.population - c.population));
          if (sameRegion.length) out.push(`Compare with ${sameRegion[0].name}`);
          return out;
        }
        case 'comparison': {
          const [c1, c2] = currentView.data;
          const larger = c1.population > c2.population ? c1 : c2;
          return [`Show detail for ${larger.name}`, `Flag ${larger.name}`];
        }
      }
      return [];
    }

    function getDynamicTools() {
      if (flaggedCountries.size === 0) return [];
      return [
        {
          name: 'review_flags',
          title: 'Review Flags',

          exec: async () => {
            const flagged = [...flaggedCountries.keys()].map(name => COUNTRIES.find(c => c.name === name)).filter(Boolean);

            return {
              displayed: true, count: flagged.length,
              summary: `Showing ${flagged.length} flagged country(ies).`,
              countries: flagged.map(c => ({ name: c.name, note: flaggedCountries.get(c.name).note, region: c.region }))
            };
          }
        },
        {
          name: 'clear_all_flags',
          title: 'Clear All Flags',
          description: `Remove all ${flaggedCountries.size} country flags. This action cannot be undone.`,

        }
      ];
    }

    function adjustTool(t) {
      if (t.name !== 'compare_countries') return t;
      const visible = (currentView.type === 'table' && currentView.data) ? currentView.data : COUNTRIES;
      const names = visible.map(c => c.name);
      return {
        ...t,
        schema: {
          ...t.schema,
          properties: {
            country1: { ...t.schema.properties.country1, enum: names },
            country2: { ...t.schema.properties.country2, enum: names }
          }
        }
      };
    }

    const SCENARIO_PROMPTS = {
      'Run global development analysis': `Analyse world development data \u2014 chain all steps without pausing:
1. Call summarize_data for global totals and the population-weighted averages
2. Call plot_development_scatter to show wealth against lifespan across all countries
3. Call rank_countries for the bottom 10 by life expectancy
4. Call show_country_trend for life expectancy in the two lowest-ranked countries since 1960
5. Write 2-3 sentences on where the gap is closing and where it is not\u2014 cite the numbers you saw`
    };

    const QUICK_ACTIONS = [
      'Run global development analysis',
      'Wealth vs lifespan, all countries',
      'Top 10 by GDP per capita',
      'Life expectancy in Brazil vs Portugal since 1960',
      'Which income group has the fastest internet adoption?'
    ];

    /* ── Mount ── */

    runtime = mount({
      tools: TOOL_DEFS,
      getDynamicTools,
      adjustTool,
      getSystemPrompt,
      getDividerContext,
      quickActions: QUICK_ACTIONS,
      promptFor: (label) => SCENARIO_PROMPTS[label] || label,
      getFollowupSuggestions,
      ghOAuthScope: 'webmcp/countries',
    });

    /* ── Init ── */

    async function init() {
      renderSkeleton();
      try {
        // Three parallel calls. The five WDI indicators batch into one request
        // (source=2); CO2 sits in a different source and cannot join that batch.
        // mrnev=1 asks for each country's most recent non-empty value, so a
        // country reporting late still contributes rather than showing blank.
        const WDI = ['SP.POP.TOTL', 'NY.GDP.PCAP.CD', 'SP.DYN.LE00.IN', 'SP.DYN.TFRT.IN', 'IT.NET.USER.ZS'];
        const [meta, wdi, co2] = await Promise.all([
          wbFetch('https://api.worldbank.org/v2/country?format=json&per_page=400'),
          wbFetch(`https://api.worldbank.org/v2/country/all/indicator/${WDI.join(';')}?format=json&source=2&per_page=20000&mrnev=1`),
          wbFetch(`https://api.worldbank.org/v2/country/all/indicator/${CO2_INDICATOR}?format=json&per_page=400&mrnev=1`)
            .catch(() => []),   // emissions are a bonus axis, not load-bearing
        ]);

        // region.id === 'NA' marks an aggregate ("Sub-Saharan Africa", "World"),
        // not a country. Mixing them in silently double-counts every total.
        const byIso = new Map();
        for (const c of meta) {
          if (c.region?.id === 'NA') continue;
          byIso.set(c.id, {
            name: c.name,
            iso3: c.id,
            region: (c.region?.value || '').trim(),
            income: (c.incomeLevel?.value || 'Not classified').trim(),
            capital: c.capitalCity || 'N/A',
            lat: parseFloat(c.latitude) || null,
            lon: parseFloat(c.longitude) || null,
          });
        }

        const FIELD = {
          'SP.POP.TOTL': 'population', 'NY.GDP.PCAP.CD': 'gdpPerCapita',
          'SP.DYN.LE00.IN': 'lifeExpectancy', 'SP.DYN.TFRT.IN': 'fertility',
          'IT.NET.USER.ZS': 'internet', [CO2_INDICATOR]: 'co2PerCapita',
        };
        for (const row of [...wdi, ...co2]) {
          const country = byIso.get(row.countryiso3code);
          const field = FIELD[row.indicator?.id];
          if (!country || !field || row.value == null) continue;
          country[field] = row.value;
          country[`${field}Year`] = row.date;
        }

        COUNTRIES = [...byIso.values()]
          .filter(c => c.population)          // no population = no usable row
          .sort((a, b) => b.population - a.population);
        if (!COUNTRIES.length) throw new Error('no country rows returned');
      } catch (err) {
        display.innerHTML = `<p class="msg-error">Failed to load World Bank data: ${err.message}</p>`;
        return;
      }
      loadFlags();
      if (!decodeHashToView()) renderTable(COUNTRIES);
    }

    init();
  </script>
</body>
</html>
