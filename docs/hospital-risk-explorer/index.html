<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#eef0e6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='15'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E">
  <title>WebMCP — US Hospital Capacity</title>
  <style>
    .compare-better {
      color: var(--risk-low);
      font-weight: 700;
    }
  </style>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../app.css">
  <link rel="stylesheet" href="../ui.css">
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js" as="script">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <div class="main-column">
    <header>
      <div class="header-left">
        <h1><a class="home-link" href="../">WebMCP</a></h1>
        <button class="tools-toggle" id="tools-toggle" aria-expanded="false" aria-controls="tools-panel">&#9660; 9 tools</button>
      </div>
      <div class="settings-wrap">
        <button class="settings-btn" id="settings-btn" aria-label="Settings" aria-expanded="false" aria-controls="settings-popover" title="Settings">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
            <path d="M6.08 1.5a.5.5 0 0 0-.495.43l-.198 1.382a4.5 4.5 0 0 0-.968.565L3.1 3.29a.5.5 0 0 0-.617.172L1.5 4.9a.5.5 0 0 0 .1.657l1.1.9A4.5 4.5 0 0 0 2.6 7.5c0 .328.034.648.1.943l-1.1.9a.5.5 0 0 0-.1.657l.984 1.438a.5.5 0 0 0 .617.172l1.319-.588c.298.213.617.398.968.565l.198 1.383a.5.5 0 0 0 .495.43h1.84a.5.5 0 0 0 .495-.43l.198-1.383a4.5 4.5 0 0 0 .968-.565l1.319.588a.5.5 0 0 0 .617-.172L13.4 10a.5.5 0 0 0-.1-.657l-1.1-.9c.066-.295.1-.615.1-.943s-.034-.648-.1-.943l1.1-.9A.5.5 0 0 0 13.5 4.9l-.984-1.438a.5.5 0 0 0-.617-.172l-1.319.588a4.5 4.5 0 0 0-.968-.565L9.415 1.93A.5.5 0 0 0 8.92 1.5H6.08ZM7.5 9.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z" fill="currentColor"/>
          </svg>
        </button>
        <div class="settings-popover" id="settings-popover" hidden role="dialog" aria-label="Settings">

          <div class="settings-section">
            <div class="settings-section-label">Appearance</div>
            <div class="theme-toggle" role="group" aria-label="Color theme">
              <button class="theme-opt" data-theme="system">System</button>
              <button class="theme-opt" data-theme="light">Light</button>
              <button class="theme-opt" data-theme="dark">Dark</button>
            </div>
          </div>

        </div>
      </div>
    </header>

    <div class="tools-panel" id="tools-panel" data-collapsed="true">
      <div class="tools-panel-inner" id="tools-panel-inner"></div>
    </div>

    <!-- Filled by the runtime from mount({ dataSource }). Hidden until the
         fetch lands, so it never describes rows that aren't there yet. -->
    <div class="source-bar" id="source-bar" hidden></div>

    <main>
      <nav class="controls" aria-label="Views and filters">
        <button class="chip" aria-pressed="true" data-filter="all">All</button>
        <button class="chip" aria-pressed="false" data-filter="CA">California</button>
        <button class="chip" aria-pressed="false" data-filter="TX">Texas</button>
        <button class="chip" aria-pressed="false" data-filter="NY">New York</button>
        <button class="chip" aria-pressed="false" data-filter="FL">Florida</button>
        <button class="chip" aria-pressed="false" data-filter="MI">Michigan</button>
        <button class="chip" aria-pressed="false" data-filter="high">Most occupied</button>
        <button class="chip" aria-pressed="false" data-view="chart">Occupancy spread</button>
      </nav>

      <div id="display"></div>
    </main>
  </div>

  <button class="discovery-tab" id="discovery-tab" aria-expanded="false" aria-controls="discovery-panel" title="Guide and activity">
    <svg class="discovery-tab-icon-open" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.3"/>
      <path d="M10.5 5.5L9 9L5.5 10.5L7 7L10.5 5.5Z" fill="currentColor"/>
    </svg>
    <svg class="discovery-tab-icon-close" width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
      <path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    Guide
  </button>
  <aside class="discovery-panel" id="discovery-panel" data-collapsed="true" aria-label="Guide and activity">
    <div class="discovery-panel-tabs" role="tablist">
      <button class="discovery-panel-tab active" data-view="guide" role="tab" aria-selected="true">Guide</button>
      <button class="discovery-panel-tab" data-view="activity" role="tab" aria-selected="false">Activity</button>
    </div>
    <div class="discovery-guide" id="discovery-guide"></div>
    <div class="discovery-activity" id="discovery-activity" hidden></div>
  </aside>

  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <p class="dialog-title" id="confirm-title">Confirm action</p>
      <p class="dialog-tool" id="confirm-tool"></p>
      <p class="dialog-args" id="confirm-args"></p>
      <div class="dialog-actions">
        <button class="btn-cancel" value="cancel">Cancel</button>
        <button class="btn-confirm" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>

  <dialog id="prompt-dialog" aria-labelledby="prompt-title">
    <form method="dialog">
      <p class="dialog-title" id="prompt-title"></p>
      <input type="text" class="dialog-input" id="prompt-input" autocomplete="off">
      <div class="dialog-actions">
        <button class="btn-cancel" value="cancel">Skip</button>
        <button class="btn-confirm" value="confirm">Add</button>
      </div>
    </form>
  </dialog>

  <script>
    // Theme pre-paint — runs synchronously before runtime loads to avoid FOUC.
    (function () {
      const stored = localStorage.getItem('webmcp-theme') || 'system';
      const resolved = stored === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : stored;
      document.documentElement.dataset.theme = resolved;
    })();
  </script>
  <script type="module">
    import { mount, showToast, showConfirmDialog, showPromptDialog } from '../runtime/index.js';

    /* ── State ── */

    // The last week the federal program collected. Pinned deliberately — see init().
    const WEEK = '2024-04-21T00:00:00.000';
    const FIELDS = [
      'hospital_name', 'city', 'state',
      'total_beds_7_day_avg', 'inpatient_beds_used_7_day_avg',
      'total_icu_beds_7_day_avg', 'icu_beds_used_7_day_avg',
    ];

    let HOSPITALS = [];
    const flaggedHospitals = new Map();
    let currentView = { type: 'table', data: null, label: null, filters: null };
    let chartInstance = null;

    /* ── Utilities ── */

    // Bands over a measured ratio, not a score. The thresholds are a display
    // choice and nothing downstream depends on them.
    const occTier = (o) => o == null ? 'low' : o >= 85 ? 'high' : o >= 60 ? 'medium' : 'low';
    const num = (v, suffix = '') => v == null ? '—' : fmt(v) + suffix;
    const fmt = (n, d = 1) => n.toFixed(d);
    const pct = (n) => fmt(n) + '%';
    const matchName = (h, q) => h.name.toLowerCase().includes(q.toLowerCase());

    const filterData = ({ state, occupancy, search } = {}) =>
      HOSPITALS.filter(h => {
        if (state && h.state !== state) return false;
        if (occupancy && occTier(h.occupancy) !== occupancy) return false;
        if (search && !matchName(h, search)) return false;
        return true;
      });

    /* ── Persistence ── */

    function persistFlags() {
      const data = [...flaggedHospitals.entries()].map(([name, flag]) => ({ name, ...flag }));
      localStorage.setItem('webmcp-flags', JSON.stringify(data));
    }
    function loadFlags() {
      try {
        const data = JSON.parse(localStorage.getItem('webmcp-flags') || '[]');
        data.forEach(({ name, ...flag }) => flaggedHospitals.set(name, flag));
      } catch (err) {
        console.warn('Discarding corrupted webmcp-flags from localStorage:', err);
        localStorage.removeItem('webmcp-flags');
      }
    }

    /* ── ECharts theme ── */

    const display = document.getElementById('display');

    echarts.registerTheme('webmcp', {
      backgroundColor: 'transparent',
      textStyle: { fontFamily: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" },
      title: { textStyle: { color: '#f1f5f9' } },
      legend: { textStyle: { color: '#94a3b8' } },
      categoryAxis: { axisLine: { lineStyle: { color: '#475569' } }, axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#1e293b' } } },
      valueAxis: { axisLine: { lineStyle: { color: '#475569' } }, axisLabel: { color: '#94a3b8' }, splitLine: { lineStyle: { color: '#1e293b' } } },
      tooltip: { backgroundColor: '#1e293b', borderColor: '#475569', textStyle: { color: '#f1f5f9' } }
    });

    window.addEventListener('resize', () => chartInstance?.resize());

    /* ── Renderers ── */

    let runtime;  // populated by mount()

    function renderSkeleton() {
      display.innerHTML = `
        <div class="loading-skeleton">
          ${Array.from({ length: 8 }, (_, i) =>
            `<div class="skeleton-row" style="animation-delay: ${i * 80}ms"></div>`
          ).join('')}
        </div>
      `;
    }

    function renderTable(hospitals, label, filters) {
      currentView = { type: 'table', data: hospitals, label, filters };
      const summary = label || `${hospitals.length} hospitals`;

      if (hospitals.length === 0) {
        display.innerHTML = `<p class="empty-state">No hospitals match the current filters.</p>`;
        encodeViewToHash();
        runtime?.refresh();
        return;
      }

      display.innerHTML = `
        <div class="summary-row">
          <p class="view-label">Showing ${summary}</p>
          <span class="summary-count">${hospitals.length} result${hospitals.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>Hospital</th><th>City</th><th>State</th><th class="num">Beds</th><th class="num">Occupied</th><th class="num">Occupancy</th>
            </tr>
          </thead>
          <tbody>
            ${hospitals.map(h => {
              const isFlagged = flaggedHospitals.has(h.name);
              return `
              <tr tabindex="0" data-name="${h.name}">
                <td><span class="name-cell">${isFlagged ? '<span class="flag-dot" title="Flagged"></span>' : ''}${h.name}</span></td>
                <td>${h.city}</td>
                <td>${h.state}</td>
                <td class="num">${num(h.beds)}</td>
                <td class="num">${num(h.used)}</td>
                <td class="num"><span class="risk-badge ${occTier(h.occupancy)}">${num(h.occupancy, '%')}</span>${h.inconsistent ? ' <span class="detail-suffix" title="The source reports more beds occupied than the facility reports having">⚠</span>' : ''}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        </div>
      `;
      encodeViewToHash();
      runtime?.refresh();
    }

    function renderEChart(option, label) {
      currentView = { type: 'chart', data: option, label, filters: {} };
      if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
      display.innerHTML = `
        <p class="view-label">${label}</p>
        <div id="chart-container" class="chart-container"></div>
      `;
      chartInstance = echarts.init(document.getElementById('chart-container'), 'webmcp');
      chartInstance.setOption(option);
      encodeViewToHash();
      runtime?.refresh();
    }

    function renderDetail(hospital) {
      const h = hospital;
      const tier = occTier(h.occupancy);

      display.innerHTML = `
        <button class="back-btn">&#8592; Back to list</button>
        <div class="detail-card">
          <div class="detail-header">
            <h2>${flag ? '<span class="flag-dot"></span>' : ''}${h.name}</h2>
            <p class="detail-meta">${h.city}, ${h.state} &middot; week of ${WEEK.slice(0, 10)} &middot; <span class="risk-badge ${tier}">${num(h.occupancy, '%')} occupied</span></p>
          </div>
          ${flag ? `<p class="flag-note">${escapeHtml(flag.note)}</p>` : ''}
          ${h.inconsistent ? `<p class="flag-note">The source reports more inpatient beds occupied than this facility reports having. Shown as filed.</p>` : ''}
          <div class="detail-grid">
            <div class="detail-cell"><div class="detail-cell-label">Inpatient beds</div><div class="detail-cell-value">${num(h.beds)}</div></div>
            <div class="detail-cell"><div class="detail-cell-label">Beds occupied</div><div class="detail-cell-value">${num(h.used)}</div></div>
            <div class="detail-cell"><div class="detail-cell-label">Occupancy</div><div class="detail-cell-value color-risk-${tier}">${num(h.occupancy, '%')}</div></div>
            <div class="detail-cell"><div class="detail-cell-label">ICU beds</div><div class="detail-cell-value">${num(h.icuBeds)}</div></div>
            <div class="detail-cell"><div class="detail-cell-label">ICU occupied</div><div class="detail-cell-value">${num(h.icuUsed)}</div></div>
            <div class="detail-cell"><div class="detail-cell-label">ICU occupancy</div><div class="detail-cell-value">${num(h.icuOccupancy, '%')}</div></div>
          </div>
          <p class="detail-suffix">7-day averages as filed with HHS. Dashes are values HHS suppressed.</p>
        </div>
      `;
      encodeViewToHash();
      runtime?.refresh();
    }

    function renderComparison(h1, h2) {
      currentView = { type: 'comparison', data: [h1, h2], label: null, filters: null };
      const metrics = [
        { label: 'Inpatient beds', key: 'beds', format: v => num(v), lowerBetter: false },
        { label: 'Beds occupied', key: 'used', format: v => num(v), lowerBetter: false },
        { label: 'Occupancy', key: 'occupancy', format: v => num(v, '%'), lowerBetter: true },
        { label: 'ICU beds', key: 'icuBeds', format: v => num(v), lowerBetter: false },
        { label: 'ICU occupied', key: 'icuUsed', format: v => num(v), lowerBetter: false },
        { label: 'ICU occupancy', key: 'icuOccupancy', format: v => num(v, '%'), lowerBetter: true },
      ];
      const betterClass = (v1, v2, lower) => v1 === v2 ? ['', ''] : ((lower ? v1 < v2 : v1 > v2) ? ['compare-better', ''] : ['', 'compare-better']);

      display.innerHTML = `
        <button class="back-btn">&#8592; Back to list</button>
        <p class="view-label">Comparing two hospitals</p>
        <table class="compare-table">
          <thead><tr><th>Metric</th><th>${h1.name}</th><th>${h2.name}</th></tr></thead>
          <tbody>
            ${metrics.map(m => {
              const [c1, c2] = betterClass(h1[m.key], h2[m.key], m.lowerBetter);
              return `<tr>
                <td class="compare-metric">${m.label}</td>
                <td class="compare-value ${c1}">${m.format(h1[m.key])}</td>
                <td class="compare-value ${c2}">${m.format(h2[m.key])}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      `;
      encodeViewToHash();
      runtime?.refresh();
    }



    function refreshCurrentView() {
      if (currentView.type === 'table') renderTable(currentView.data || HOSPITALS, currentView.label, currentView.filters);
      else if (currentView.type === 'chart' && currentView.data) renderEChart(currentView.data, currentView.label);
      else if (currentView.type === 'detail' && currentView.data) renderDetail(currentView.data);
      else if (currentView.type === 'comparison' && currentView.data) renderComparison(currentView.data[0], currentView.data[1]);
    }

    /* ── Hash routing ── */

    function encodeViewToHash() {
      const params = new URLSearchParams();
      params.set('view', currentView.type);
      const f = currentView.filters || {};
      if (currentView.type === 'table') {
        if (f.state) params.set('state', f.state);
        if (f.occupancy) params.set('occupancy', f.occupancy);
      } else if (currentView.type === 'detail' && currentView.data) {
        params.set('name', currentView.data.name);
      } else if (currentView.type === 'comparison' && currentView.data) {
        params.set('h1', currentView.data[0].name);
        params.set('h2', currentView.data[1].name);
      }
      history.replaceState(null, '', '#' + params.toString());
    }

    function decodeHashToView() {
      const hash = location.hash.slice(1);
      if (!hash) return false;
      const params = new URLSearchParams(hash);
      const view = params.get('view');

      if (view === 'table') {
        const state = params.get('state');
        const occupancy = params.get('occupancy');
        if (state) renderTable(filterData({ state }), `hospitals in ${state}`, { state });
        else if (occupancy) renderTable(filterData({ occupancy }), `hospitals at ${occupancy} occupancy`, { occupancy });
        else renderTable(HOSPITALS);
        return true;
      }
      if (view === 'chart') { renderTable(HOSPITALS); return true; }
      if (view === 'detail') {
        const h = HOSPITALS.find(h => h.name === params.get('name'));
        if (h) { renderDetail(h); return true; }
      }
      if (view === 'comparison') {
        const h1 = HOSPITALS.find(h => h.name === params.get('h1'));
        const h2 = HOSPITALS.find(h => h.name === params.get('h2'));
        if (h1 && h2) { renderComparison(h1, h2); return true; }
      }
      return false;
    }

    window.addEventListener('hashchange', () => { if (HOSPITALS.length) decodeHashToView(); });

    /* ── Display event delegation ── */

    display.addEventListener('click', (e) => {
      const row = e.target.closest('tr[data-name]');
      if (row) { const h = HOSPITALS.find(x => x.name === row.dataset.name); if (h) renderDetail(h); return; }
      const back = e.target.closest('.back-btn');
      if (back) renderTable(HOSPITALS);
    });
    display.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const row = e.target.closest('tr[data-name]');
      if (row) { const h = HOSPITALS.find(x => x.name === row.dataset.name); if (h) renderDetail(h); }
    });

    /* ── Controls (chips) ── */

    document.querySelectorAll('.chip[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => {
          c.classList.remove('active');
          c.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        const filter = btn.dataset.filter;
        if (filter === 'all') renderTable(HOSPITALS);
        else if (filter === 'high') renderTable(filterData({ occupancy: 'high' }), 'hospitals at 85%+ occupancy', { occupancy: 'high' });
        else renderTable(filterData({ state: filter }), `hospitals in ${filter}`, { state: filter });
      });
    });

    document.querySelectorAll('.chip[data-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => {
          c.classList.remove('active');
          c.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        const view = btn.dataset.view;
        if (view === 'chart') {
          const tiers = { low: 0, medium: 0, high: 0 };
          HOSPITALS.forEach(h => tiers[occTier(h.occupancy)]++);
          renderEChart({
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: ['Low', 'Medium', 'High'] },
            yAxis: { type: 'value' },
            series: [{ type: 'bar', data: [
              { value: tiers.low, itemStyle: { color: '#22c55e' } },
              { value: tiers.medium, itemStyle: { color: '#f59e0b' } },
              { value: tiers.high, itemStyle: { color: '#ef4444' } }
            ] }]
          }, 'Risk distribution across all hospitals');
        } else if (view === 'trends' || view === 'statewide') {
          // Views removed with the invented metrics they aggregated. An old
          // bookmark lands on the table rather than calling a tool that is gone.
          renderTable(HOSPITALS);
        }
      });
    });

    /* ── Tool definitions ── */

    const TOOL_DEFS = [
      {
        name: 'filter_hospitals',
        title: 'Filter Hospitals',
        description: 'Filter and display hospitals on the page. Renders a table of city, state, inpatient beds, beds occupied and occupancy for the reporting week. The user can then click any row for the full record.',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: {
          type: 'object',
          properties: {
            state: { type: 'string', description: 'Two-letter state code, e.g. CA' },
            occupancy: { type: 'string', enum: ['low', 'medium', 'high'], description: 'Occupancy band: high is 85%+, medium 60-85%, low below 60%' },
            search: { type: 'string', description: 'Search hospital name (partial match)' }
          }
        },
        exec: async (input) => {
          const filtered = filterData(input);
          const parts = [];
          if (input.state) parts.push(`in ${input.state}`);
          if (input.risk) parts.push(`${input.risk} risk`);
          if (input.search) parts.push(`matching "${input.search}"`);
          const label = parts.length ? parts.join(', ') : 'all hospitals';
          renderTable(filtered, label, { state: input.state, risk: input.risk });
          return { displayed: true, count: filtered.length, summary: `Rendered ${filtered.length} hospitals (${label}). User can now see the table and click any row for details.` };
        }
      },
      {
        name: 'render_chart',
        title: 'Render Chart',
        description: 'Render an Apache ECharts visualization. Generate a full ECharts option object with the appropriate chart type (bar, line, pie, scatter, radar, etc.) based on the data. Use the data available from previous tool calls. Colors should use the palette: ["#38bdf8", "#22c55e", "#f59e0b", "#ef4444", "#a78bfa", "#ec4899"].',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: {
          type: 'object',
          properties: {
            option: { type: 'object', description: 'Full ECharts option object (series, xAxis, yAxis, tooltip, legend, etc.)' },
            label: { type: 'string', description: 'Short description shown above the chart' }
          },
          required: ['option', 'label']
        },
        exec: async (input) => { renderEChart(input.option, input.label); return { displayed: true, summary: `Chart rendered: ${input.label}` }; }
      },
      {
        name: 'show_hospital_detail',
        title: 'Hospital Detail',
        description: 'Display a profile card for one hospital: inpatient beds, beds occupied, occupancy, and the same three for ICU, as filed with HHS for the reporting week.',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: { type: 'object', properties: { name: { type: 'string', description: 'Hospital name (partial match supported)' } }, required: ['name'] },
        exec: async (input) => {
          const h = HOSPITALS.find(x => matchName(x, input.name));
          if (!h) return { displayed: false, summary: `No hospital found matching "${input.name}".` };
          renderDetail(h);
          return { displayed: true, summary: `Showing ${h.name} (${h.city}, ${h.state}) — ${num(h.beds)} beds, ${num(h.occupancy, '%')} occupied, ICU ${num(h.icuOccupancy, '%')}.` };
        }
      },
      {
        name: 'flag_hospital',
        title: 'Flag Hospital',
        description: 'Flag or unflag a hospital with a note. Flagged hospitals display an amber indicator dot in tables and detail views. Use this to mark hospitals that warrant attention or follow-up.',
        readOnlyHint: false, idempotentHint: false, destructiveHint: false, openWorldHint: false,
        schema: {
          type: 'object',
          properties: {
            name: { type: 'string', description: 'Hospital name (partial match supported)' },
            note: { type: 'string', description: 'Reason for flagging (displayed on detail card)' },
            unflag: { type: 'boolean', description: 'Set to true to remove the flag' }
          },
          required: ['name']
        },
        exec: async (input) => {
          const h = HOSPITALS.find(x => matchName(x, input.name));
          if (!h) return { summary: `No hospital found matching "${input.name}".` };

          if (input.unflag) {
            const previous = flaggedHospitals.get(h.name);
            flaggedHospitals.delete(h.name);
            persistFlags();
            refreshCurrentView();
            runtime?.refresh();
            showToast('Flag removed', () => {
              flaggedHospitals.set(h.name, previous || { note: 'Flagged for review', timestamp: Date.now() });
              persistFlags();
              refreshCurrentView();
              runtime?.refresh();
            });
            return { summary: `Removed flag from ${h.name}.` };
          }

          let note = input.note;
          if (!note) {
            note = await showPromptDialog(`Add a note for flagging ${h.name} (optional)`);
          }
          const flagData = { note: note || 'Flagged for review', timestamp: Date.now() };
          flaggedHospitals.set(h.name, flagData);
          persistFlags();
          refreshCurrentView();
          runtime?.refresh();
          showToast('Hospital flagged', () => {
            flaggedHospitals.delete(h.name);
            persistFlags();
            refreshCurrentView();
            runtime?.refresh();
          });
          return { summary: `Flagged ${h.name}: "${flagData.note}".` };
        }
      },
      {
        name: 'compare_hospitals',
        title: 'Compare Hospitals',
        description: 'Display a side-by-side comparison of two hospitals: inpatient beds, beds occupied, occupancy, and the same three for ICU.',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: {
          type: 'object',
          properties: {
            hospital1: { type: 'string', description: 'First hospital name (partial match)' },
            hospital2: { type: 'string', description: 'Second hospital name (partial match)' }
          },
          required: ['hospital1', 'hospital2']
        },
        exec: async (input) => {
          const h1 = HOSPITALS.find(x => matchName(x, input.hospital1));
          const h2 = HOSPITALS.find(x => matchName(x, input.hospital2));
          if (!h1) return { displayed: false, summary: `No hospital found matching "${input.hospital1}".` };
          if (!h2) return { displayed: false, summary: `No hospital found matching "${input.hospital2}".` };
          renderComparison(h1, h2);
          return { displayed: true, summary: `Comparing ${h1.name} vs ${h2.name}: occupancy ${num(h1.occupancy, '%')} vs ${num(h2.occupancy, '%')}, beds ${num(h1.beds)} vs ${num(h2.beds)}.` };
        }
      },
      {
        name: 'summarize_data',
        title: 'Summarize Data',
        description: 'Compute aggregate statistics for the hospital dataset. Returns numerical summaries (averages, distributions, extremes) without rendering any visualization. Use this to analyze data before deciding what to show.',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: {
          type: 'object',
          properties: { state: { type: 'string', description: 'Two-letter state code, e.g. CA. Omit for the national picture.' } }
        },
        exec: async (input) => {
          const data = input.state ? filterData({ state: input.state }) : HOSPITALS;
          const avg = (fn) => data.reduce((s, h) => s + fn(h), 0) / data.length;
          const have = (k) => data.filter(h => h[k] != null);
          const totalBeds = have('beds').reduce((s, h) => s + h.beds, 0);
          const totalUsed = have('used').reduce((s, h) => s + h.used, 0);
          const dist = { high: 0, medium: 0, low: 0 };
          data.forEach(h => dist[occTier(h.occupancy)]++);
          const sorted = [...data].sort((a, b) => (b.occupancy ?? -1) - (a.occupancy ?? -1));
          const busiest = sorted[0], quietest = sorted[sorted.length - 1];
          const scope = input.state || 'all states';
          return {
            scope, count: data.length, week: WEEK.slice(0, 10),
            totalBeds, totalOccupied: totalUsed,
            // Weighted by beds — averaging each hospital's percentage would let an
            // 8-bed facility count as much as an 800-bed one.
            aggregateOccupancyPct: totalBeds ? (totalUsed / totalBeds) * 100 : null,
            occupancyBands: dist,
            busiest: { name: busiest.name, occupancy: busiest.occupancy },
            quietest: { name: quietest.name, occupancy: quietest.occupancy },
            summary: `${data.length} hospitals (${scope}), week of ${WEEK.slice(0, 10)}: ${totalBeds.toLocaleString()} inpatient beds, ${totalBeds ? ((totalUsed / totalBeds) * 100).toFixed(1) : '—'}% occupied overall. Busiest: ${busiest.name} (${num(busiest.occupancy, '%')}).`
          };
        }
      },
      {
        name: 'export_flagged',
        title: 'Export Flagged',
        description: 'Download a CSV file of all currently flagged hospitals with their flag notes and key metrics. Produces a file download, does not render a visualization.',
        readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
        schema: { type: 'object', properties: {} },
        exec: async () => {
          if (flaggedHospitals.size === 0) return { summary: 'No hospitals are currently flagged.' };
          const headers = ['Name', 'County', 'Risk Tier', 'Risk Probability', 'Operating Margin', 'Equity Burden', 'Flag Note', 'Flagged At'];
          const rows = [...flaggedHospitals.entries()].map(([name, flag]) => {
            const h = HOSPITALS.find(x => x.name === name);
            return [name, h.city, h.state, h.beds ?? '', h.used ?? '', h.occupancy?.toFixed(1) ?? '', h.icuOccupancy?.toFixed(1) ?? '', flag.note, new Date(flag.timestamp).toISOString()];
          });
          const csv = [headers, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
          const blob = new Blob([csv], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'flagged-hospitals.csv';
          a.click();
          URL.revokeObjectURL(url);
          return { summary: `Exported ${flaggedHospitals.size} flagged hospital(s) as CSV.` };
        }
      },
    ];

    /* ── Dynamic + adjusted tools ── */
    //
    // There is no system prompt here — nothing sends one anywhere. Per-tool
    // guidance lives on each tool's own description (e.g. render_chart's
    // palette line, below); a native WebMCP agent reads descriptions, never
    // a page-level prompt, so cross-tool tone or chaining guidance has
    // nowhere to live and is simply left unstated.

    function getDynamicTools() {
      if (flaggedHospitals.size === 0) return [];
      return [
        {
          name: 'review_flags',
          title: 'Review Flags',
          description: `Show all ${flaggedHospitals.size} currently flagged hospitals with their notes and risk metrics.`,
          readOnlyHint: true, idempotentHint: true, destructiveHint: false, openWorldHint: false,
          schema: { type: 'object', properties: {} },
          exec: async () => {
            const flagged = [...flaggedHospitals.keys()].map(name => HOSPITALS.find(h => h.name === name)).filter(Boolean);
            renderTable(flagged, 'flagged hospitals');
            return {
              displayed: true, count: flagged.length,
              summary: `Showing ${flagged.length} flagged hospital(s).`,
              hospitals: flagged.map(h => ({ name: h.name, note: flaggedHospitals.get(h.name).note, occupancy: h.occupancy }))
            };
          }
        },
        {
          name: 'clear_all_flags',
          title: 'Clear All Flags',
          description: `Remove all ${flaggedHospitals.size} hospital flags. This action cannot be undone.`,
          readOnlyHint: false, idempotentHint: true, destructiveHint: true, openWorldHint: false,
          schema: { type: 'object', properties: {} },
          exec: async () => {
            // Nothing outside this function gates destructive tools — the
            // confirm lives here, unconditionally, on every call.
            const count = flaggedHospitals.size;
            const ok = await showConfirmDialog('Clear All Flags', { count });
            if (!ok) return { summary: 'Cancelled — flags left in place.' };
            flaggedHospitals.clear();
            persistFlags();
            refreshCurrentView();
            runtime?.refresh();
            return { summary: `Cleared ${count} flag(s).` };
          }
        }
      ];
    }

    function adjustTool(t) {
      if (t.name !== 'compare_hospitals') return t;
      // The dataset, not the current view — see countries/index.html's
      // adjustTool for why: a schema tied to currentView churns on every
      // render (including this tool's own), which a turn-scoped agent
      // that snapshots a schema once and refuses stale re-reads can't
      // tolerate. HOSPITALS only changes on a fresh page load — except
      // across the load itself: registering an empty enum before the
      // fetch resolves, then the real one after, is the same kind of
      // mid-session schema change this function exists to avoid. Skip
      // adjusting until there's a dataset to draw the enum from.
      if (!HOSPITALS.length) return t;
      const names = HOSPITALS.map(h => h.name);
      return {
        ...t,
        schema: {
          ...t.schema,
          properties: {
            hospital1: { ...t.schema.properties.hospital1, enum: names },
            hospital2: { ...t.schema.properties.hospital2, enum: names }
          }
        }
      };
    }

    /* ── Mount runtime ── */

    // Declared before mount(), which renders the source bar synchronously —
    // a `let` read from inside that first render would hit its dead zone.
    let SOURCE = null;

    runtime = mount({
      tools: TOOL_DEFS,
      getDynamicTools,
      adjustTool,
      dataSource: () => SOURCE,
      guide: {
        intro: "This page tracks 1,265 US hospitals' inpatient and ICU bed capacity, as filed with HHS for the program's final reporting week. An agent sharing this tab can filter, chart, and compare facilities directly.",
        prompts: [
          'Which hospitals are over capacity?',
          'Compare California and Texas occupancy',
          'Show the occupancy distribution as a chart',
          "What's the busiest hospital in the dataset?",
          'Flag hospitals reporting inconsistent bed counts',
        ],
      },
    });

    /* ── Init ── */

    async function init() {
      renderSkeleton();
      try {
        // HHS "COVID-19 Reported Patient Impact and Hospital Capacity by Facility":
        // real, facility-level, weekly. Reporting ended 2024-04-21, so that final
        // week is the snapshot — a fixed date rather than "latest", because a
        // moving target would silently change what this page claims.
        //
        // Two filters are applied server-side and both are load-bearing. Values of
        // -999999 are HHS's small-count suppression, not measurements; arithmetic on
        // them produces negative bed counts. And a 7-day average over fewer than 7
        // reported days is not comparable to one over 7 — before requiring full
        // coverage, the "busiest hospital in America" came out at 1804% occupancy,
        // which is a reporting artifact, not a fact.
        const where = [
          `collection_week='${WEEK}'`,
          'total_beds_7_day_avg>0',
          'inpatient_beds_used_7_day_avg>=0',
          'total_beds_7_day_coverage=7',
          'inpatient_beds_used_7_day_coverage=7',
        ].join(' AND ');
        const RESOURCE = 'https://healthdata.gov/resource/anag-cw7u.json';
        const url = RESOURCE
          + `?$where=${encodeURIComponent(where)}`
          + `&$select=${encodeURIComponent(FIELDS.join(','))}&$limit=5000`;

        // Those filters run server-side, so without a second count the page
        // has no idea how much it is not showing. It is most of the file:
        // 4,747 facilities filed that week and about 1,265 clear the bar.
        // A bonus, not load-bearing — a failed count costs the denominator,
        // not the page.
        const [res, filed] = await Promise.all([
          fetch(url),
          fetch(`${RESOURCE}?$select=count(1) as n&$where=${encodeURIComponent(`collection_week='${WEEK}'`)}`)
            .then(r => r.ok ? r.json() : null)
            .then(rows => Number(rows?.[0]?.n) || null)
            .catch(() => null),
        ]);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.json();

        const num = (v) => {
          const n = Number(v);
          // Suppressed or absent — not zero. Zero is a measurement.
          return Number.isFinite(n) && n >= 0 ? n : null;
        };
        HOSPITALS = raw.map(r => {
          const beds = num(r.total_beds_7_day_avg);
          const used = num(r.inpatient_beds_used_7_day_avg);
          const icu = num(r.total_icu_beds_7_day_avg);
          const icuUsed = num(r.icu_beds_used_7_day_avg);
          return {
            name: (r.hospital_name || '').replace(/\s+/g, ' ').trim(),
            city: r.city || '', state: r.state || '',
            beds, used, icuBeds: icu, icuUsed,
            occupancy: beds ? (used / beds) * 100 : null,
            icuOccupancy: icu ? (icuUsed / icu) * 100 : null,
            // Kept, not hidden: a handful of facilities report more beds occupied
            // than they report having. That is what the source says.
            inconsistent: beds != null && used != null && used > beds,
          };
        }).filter(h => h.name && h.occupancy != null)
          .sort((a, b) => b.occupancy - a.occupancy);
        if (!HOSPITALS.length) throw new Error('no hospitals returned for that week');

        const dropped = filed ? filed - HOSPITALS.length : null;
        SOURCE = {
          publisher: 'U.S. Department of Health & Human Services',
          dataset: 'COVID-19 Reported Patient Impact and Hospital Capacity by Facility',
          url: 'https://healthdata.gov/d/anag-cw7u',
          rows: `${HOSPITALS.length.toLocaleString()} facilities`,
          excluded: dropped > 0
            ? `${dropped.toLocaleString()} of ${filed.toLocaleString()} dropped: fewer than 7 days reported, or counts HHS suppressed`
            : null,
          coverage: 'week of 21 April 2024 — the last week of the program',
          retrieved: Date.now(),
          caveat: 'Reporting ended with that week. These are 2024 figures, not current hospital capacity.',
        };
      } catch (err) {
        display.innerHTML = `<p class="msg-error">Failed to load HHS hospital data: ${err.message}</p>`;
        return;
      }
      loadFlags();
      if (!decodeHashToView()) renderTable(HOSPITALS);
    }

    init();
  </script>
</body>
</html>
